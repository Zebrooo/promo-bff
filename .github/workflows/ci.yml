name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Раннер выделен только этому репозиторию (self-hosted, на том же сервере,
# где живёт сам сервис) — Node на нём не предустановлен, ставим явно.
jobs:
  typecheck:
    runs-on: [self-hosted, ci]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Export NODE_AUTH_TOKEN (для приватных @zebrooo/*)
        run: echo "NODE_AUTH_TOKEN=$(cat ~/.abkhaz-deploy-token)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck

  test:
    runs-on: [self-hosted, ci]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Export NODE_AUTH_TOKEN (для приватных @zebrooo/*)
        run: echo "NODE_AUTH_TOKEN=$(cat ~/.abkhaz-deploy-token)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm test
